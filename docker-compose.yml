name: sub0

services:
  postgres:
    image: postgres:16-alpine
    container_name: sub0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub0
      POSTGRES_PASSWORD: sub0
      POSTGRES_DB: sub0
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sub0 -d sub0']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sub0-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
